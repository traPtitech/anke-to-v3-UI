services:
  client:
    build:
      context: .
      dockerfile: dev.Dockerfile
  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: ["caddy", "run", "--config", "/etc/caddy/dev.Caddyfile"]
    ports:
      - "3000:80"
    volumes:
      - ./dev.Caddyfile:/etc/caddy/dev.Caddyfile
    environment:
      - SERVER_ORIGIN=http://host.docker.internal:1323
    extra_hosts:
      - "host.docker.internal:host-gateway"
