<div class="app-shell" role="status" aria-label="アプリを読み込み中">
  <style>
    .app-shell {
      min-height: 100vh;
      color: #4a3c3e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
    }

    .app-shell-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      padding: 12px 32px;
      border-bottom: 1px solid #cbd5e1;
    }

    .app-shell-logo {
      display: block;
      width: 156px;
      height: auto;
    }

    .app-shell-action {
      width: 116px;
      height: 40px;
      border-radius: 6px;
      background: #b12929;
    }

    .app-shell-main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding-top: 18px;
    }

    .app-shell-line {
      border-radius: 999px;
      background: #e2e8f0;
    }

    .app-shell-panel {
      padding: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    .app-shell-line {
      height: 16px;
      margin-bottom: 12px;
    }

    .app-shell-line-short {
      width: 28%;
    }

    .app-shell-line-title {
      width: 58%;
      height: 22px;
    }

    @media (max-width: 900px) {
      .app-shell-header {
        min-height: 56px;
        padding: 8px 16px;
      }

      .app-shell-logo {
        width: 120px;
      }

      .app-shell-action {
        width: 92px;
        height: 32px;
      }
    }
  </style>
